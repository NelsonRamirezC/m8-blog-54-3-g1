<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Iniciar sesión | M8 Blog</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <header data-nav></header>
        <main class="page-wrap">
            <div class="container">
                <div
                    class="surface mx-auto p-4 p-md-5"
                    style="max-width: 520px"
                >
                    <p class="eyebrow">M8 Blog</p>
                    <h1 class="display-title mb-4">Iniciar sesión</h1>
                    <div data-message hidden></div>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label
                            ><input
                                class="form-control"
                                type="email"
                                id="email"
                                required
                                autocomplete="email"
                            />
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password"
                                >Password</label
                            ><input
                                class="form-control"
                                type="password"
                                id="password"
                                required
                                autocomplete="current-password"
                            />
                        </div>
                        <button class="btn btn-accent w-100" type="submit">
                            Entrar
                        </button>
                    </form>
                    <p class="meta mt-4 mb-0">
                        ¿No tienes cuenta?
                        <a href="registro.html">Regístrate aquí</a>
                    </p>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
        <script>
            document
                .querySelector("#login-form")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    try {
                        const data = await api("/usuarios/login", {
                            method: "POST",
                            body: JSON.stringify({
                                email: document.querySelector("#email").value,
                                password:
                                    document.querySelector("#password").value,
                            }),
                        });
                        localStorage.setItem("token", data.token);
                        location.href = "index.html";
                    } catch (error) {
                        showMessage(error.message);
                    }
                });
        </script>
    </body>
</html>
