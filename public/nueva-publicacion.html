<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva publicación | M8 Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header data-nav></header>
    <main class="page-wrap">
        <div class="container">
            <div class="surface mx-auto p-4 p-md-5" style="max-width: 760px">
                <p class="eyebrow">Comparte una idea</p>
                <h1 class="display-title mb-4">Nueva publicación</h1>
                <div data-message hidden></div>
                <form id="new-post-form">
                    <div class="mb-4">
                        <label class="form-label" for="titulo">Título</label>
                        <input class="form-control" id="titulo" maxlength="255" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="contenido">Contenido</label>
                        <textarea class="form-control" id="contenido" rows="10" required></textarea>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <a class="btn btn-outline-dark" href="index.html">Cancelar</a>
                        <button class="btn btn-accent" type="submit">Publicar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        if (requireAuth()) {
            document.querySelector("#new-post-form").addEventListener("submit", async (event) => {
                event.preventDefault();
                const button = event.target.querySelector("button[type=submit]");
                button.disabled = true;
                try {
                    const data = await api("/publicaciones", {
                        method: "POST",
                        body: JSON.stringify({
                            titulo: document.querySelector("#titulo").value.trim(),
                            contenido: document.querySelector("#contenido").value.trim(),
                        }),
                    });
                    location.href = `publicacion.html?id=${data.publicacion.id}`;
                } catch (error) {
                    button.disabled = false;
                    showMessage(error.message);
                }
            });
        }
    </script>
</body>

</html>
